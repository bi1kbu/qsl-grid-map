apiVersion: v1alpha1
kind: Setting
metadata:
  name: qsl-grid-map-setting
spec:
  forms:
    - group: map
      label: 地图显示
      formSchema:
        - $formkit: select
          name: provider
          label: provider（首选地图服务）
          value: tianditu
          validation: required
          options:
            - label: 天地图（失败后自动切换至 OpenFreeMap）
              value: tianditu
            - label: OpenFreeMap（开放地图，无需密钥）
              value: openfreemap
          help: 天地图底图或注记加载失败、超过 15 秒未完成时自动切换；选择 OpenFreeMap 后直接加载开放地图。
        - $formkit: text
          name: defaultCenterGrid
          label: defaultCenterGrid（本台及默认中心网格）
          value: OM89
          validation: required|matches:/^[A-Ra-r]{2}[0-9]{2}$/
          help: 两种地图共用的初始中心和本台网格，默认 OM89（中国北京）。切换地图服务时保留当前地图中心。
        - $formkit: checkbox
          name: showHomeGrid
          label: showHomeGrid（显示本台网格）
          value: true
          help: 开启后在本台网格位置显示虚线边框；关闭后不凸显本台网格位置。
        - $formkit: text
          name: homeGridBorderColor
          label: homeGridBorderColor（本台网格边框颜色）
          value: "#dc2626"
          validation: required|matches:/^#[0-9A-Fa-f]{6}$/
          help: 用于标识本台网格（默认中心网格）的虚线边框颜色。
    - group: tianditu
      label: 天地图服务
      formSchema:
        - $formkit: text
          name: appKey
          label: appKey（应用 key）
          help: 使用天地图时填写浏览器端应用 key；未填写时直接使用 OpenFreeMap（开放地图）。
        - $formkit: password
          name: secretKey
          label: secretKey（密钥）
          help: 可选。当前地图瓦片请求仅使用应用 key，密钥不会输出到前台页面。
        - $formkit: number
          name: defaultZoom
          label: defaultZoom（天地图默认缩放级别）
          value: 3
          validation: required|min:1|max:18
          help: 使用天地图时的初始缩放级别，默认 3；有效值自动限制在天地图最小与最大缩放之间。
        - $formkit: number
          name: minZoom
          label: minZoom（天地图最小缩放级别）
          value: 3
          validation: required|min:1|max:18
          help: 使用天地图时允许缩小到的级别，默认 3，范围 1～18。
        - $formkit: number
          name: maxZoom
          label: maxZoom（天地图最大缩放级别）
          value: 8
          validation: required|min:1|max:18
          help: 使用天地图时允许放大到的级别，默认 8，范围 1～18。最小值大于最大值时回退到 3～8。
    - group: openfreemap
      label: OpenFreeMap 服务
      formSchema:
        - $formkit: number
          name: defaultZoom
          label: defaultZoom（OFM 默认缩放级别）
          value: 3
          validation: required|min:1|max:18
          help: 直接加载 OFM 时的初始缩放级别，默认 3；有效值自动限制在 OFM 最小与最大缩放之间。
        - $formkit: number
          name: minZoom
          label: minZoom（OFM 最小缩放级别）
          value: 3
          validation: required|min:1|max:18
          help: 使用 OFM 时允许缩小到的级别，默认 3，范围 1～18。
        - $formkit: number
          name: maxZoom
          label: maxZoom（OFM 最大缩放级别）
          value: 8
          validation: required|min:1|max:18
          help: 使用 OFM 时允许放大到的级别，默认 8，范围 1～18。最小值大于最大值时回退到 3～8；天地图失败切换时会将当前缩放限制在 OFM 范围内。
